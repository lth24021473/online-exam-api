name: online-exam-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/online_exam?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: 
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}).ok }'
      interval: 5s
      timeout: 10s
      retries: 12

volumes:
  mongo_data:
